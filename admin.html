<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASIM WORLD — Admin Panel</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #eaf6fc; color: #1e2a38; padding-bottom: 40px; }

  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(14,165,233,0.25);
  }
  .topbar h1 { font-size: 1.05rem; color: #0284c7; }
  .logout-btn {
    background: none; border: 1px solid rgba(14,165,233,0.35);
    color: #0284c7; padding: 8px 14px; border-radius: 20px;
    font-size: 0.8rem; font-weight: bold; cursor: pointer;
  }

  /* ===== Login ===== */
  .login-wrap {
    max-width: 360px; margin: 60px auto 0; padding: 0 20px;
  }
  .login-card {
    background: #fff; border-radius: 18px; padding: 28px 22px;
    box-shadow: 0 10px 30px rgba(14,165,233,0.15);
    text-align: center;
  }
  .login-card h2 { color: #0284c7; margin-bottom: 20px; font-size: 1.2rem; }
  .login-card input {
    width: 100%; background: #eaf6fc; border: 1px solid rgba(14,165,233,0.3);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 0.9rem;
  }
  .login-card button {
    width: 100%; background: linear-gradient(90deg,#0ea5e9,#0284c7);
    color: #fff; border: none; padding: 13px; border-radius: 25px;
    font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 6px;
  }
  .login-error { color: #ef4444; font-size: 0.8rem; margin-top: 10px; min-height: 16px; }

  /* ===== Dashboard ===== */
  .dashboard { display: none; padding: 18px; max-width: 700px; margin: 0 auto; }
  .section-card {
    background: #fff; border-radius: 16px; padding: 18px;
    box-shadow: 0 3px 14px rgba(14,165,233,0.1);
    margin-bottom: 20px;
  }
  .section-card h3 { color: #0284c7; font-size: 1rem; margin-bottom: 14px; }
  .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .form-row > * { flex: 1; }
  .section-card input, .section-card select {
    width: 100%; background: #eaf6fc; border: 1px solid rgba(14,165,233,0.3);
    border-radius: 10px; padding: 11px 12px; font-size: 0.85rem; margin-bottom: 10px;
  }
  .add-btn {
    width: 100%; background: linear-gradient(90deg,#0ea5e9,#0284c7);
    color: #fff; border: none; padding: 12px; border-radius: 22px;
    font-size: 0.9rem; font-weight: bold; cursor: pointer;
  }

  .category-group { margin-bottom: 18px; }
  .category-group h4 { color: #33475a; font-size: 0.9rem; margin-bottom: 8px; }
  .product-row {
    display: flex; gap: 10px; align-items: center;
    background: #fff; border-bottom: 1px solid rgba(14,165,233,0.15);
    padding: 10px 4px;
  }
  .product-row img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #eaf6fc; }
  .product-row .info { flex: 1; }
  .product-row .info .name { font-size: 0.85rem; font-weight: bold; }
  .product-row .info .price { font-size: 0.8rem; color: #f97316; }
  .product-row .del-btn {
    background: none; border: 1px solid #ef4444; color: #ef4444;
    padding: 6px 10px; border-radius: 16px; font-size: 0.75rem; cursor: pointer;
  }
  .product-row .edit-btn {
    background: none; border: 1px solid #0284c7; color: #0284c7;
    padding: 6px 10px; border-radius: 16px; font-size: 0.75rem; cursor: pointer;
    margin-right: 6px;
  }
  .empty-msg { text-align: center; color: rgba(30,42,56,0.4); font-size: 0.85rem; padding: 10px 0; }
  .status-msg { text-align: center; font-size: 0.85rem; padding: 8px 0; min-height: 20px; }

  /* ===== New Orders Alert Banner ===== */
  .order-alert {
    display: none;
    max-width: 700px; margin: 14px auto 0; padding: 0 18px;
  }
  .order-alert.show { display: block; }
  .order-alert .box {
    background: linear-gradient(90deg,#f97316,#ea580c);
    color: #fff; border-radius: 14px; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 16px rgba(249,115,22,0.35);
    animation: alertPulse 1.6s infinite;
  }
  .order-alert .box .txt { font-weight: bold; font-size: 0.95rem; }
  .order-alert .box .count { font-size: 1.6rem; font-weight: bold; }
  @keyframes alertPulse {
    0% { box-shadow: 0 0 0 0 rgba(249,115,22,0.5); }
    70% { box-shadow: 0 0 0 12px rgba(249,115,22,0); }
    100% { box-shadow: 0 0 0 0 rgba(249,115,22,0); }
  }
  .order-del-btn {
    background: none; border: 1px solid rgba(30,42,56,0.3); color: rgba(30,42,56,0.6);
    padding: 8px; border-radius: 16px; font-size: 0.75rem; cursor: pointer;
    width: 36px; display: flex; align-items: center; justify-content: center;
  }

  /* ===== Orders ===== */
  .order-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .history-toggle {
    background: #fff; border: 1px solid rgba(30,42,56,0.3); color: rgba(30,42,56,0.6);
    padding: 6px 12px; border-radius: 16px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
    margin-bottom: 16px; display: inline-flex; align-items: center; gap: 5px;
  }
  .history-toggle.active { background: #1e2a38; color: #fff; border-color: #1e2a38; }
  .order-tab {
    background: #eaf6fc; border: 1px solid rgba(14,165,233,0.3); color: #0284c7;
    padding: 6px 12px; border-radius: 16px; font-size: 0.78rem; font-weight: bold; cursor: pointer;
  }
  .order-tab.active { background: #0284c7; color: #fff; }
  .order-card {
    background: #fff; border: 1px solid rgba(14,165,233,0.2); border-radius: 14px;
    padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(14,165,233,0.08);
  }
  .order-card .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .order-card .cust-name { font-weight: bold; font-size: 0.95rem; color: #1e2a38; }
  .order-badge {
    font-size: 0.7rem; font-weight: bold; padding: 3px 10px; border-radius: 12px;
  }
  .order-badge.Pending { background: #fff4e5; color: #f97316; }
  .order-badge.Accepted { background: #e5f6ff; color: #0284c7; }
  .order-badge.Delivered { background: #e8f9ee; color: #128C4A; }
  .order-badge.Cancelled { background: #fdeaea; color: #ef4444; }
  .order-card .meta { font-size: 0.78rem; color: rgba(30,42,56,0.6); margin-bottom: 8px; line-height: 1.6; }
  .order-card .items-list { font-size: 0.8rem; color: #1e2a38; margin-bottom: 8px; }
  .order-card .items-list div { padding: 2px 0; }
  .order-card .total-row { font-weight: bold; color: #f97316; font-size: 0.85rem; margin-bottom: 10px; }
  .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .order-actions button {
    flex: 1; min-width: 80px; border: none; padding: 8px; border-radius: 16px;
    font-size: 0.75rem; font-weight: bold; cursor: pointer; color: #fff;
  }
  .btn-accept { background: #0284c7; }
  .btn-deliver { background: #128C4A; }
  .btn-cancel { background: #ef4444; }
  .btn-call { background: #25D366; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

  <div class="topbar">
    <h1>NASIM WORLD — Admin</h1>
    <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="doLogout()">Logout</button>
  </div>

  <div class="order-alert" id="orderAlert">
    <div class="box">
      <span class="txt">🔔 নতুন অর্ডার এসেছে</span>
      <span class="count" id="pendingOrderCount">0</span>
    </div>
  </div>

  <!-- Login -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <h2>অ্যাডমিন লগইন</h2>
      <input type="email" id="loginEmail" placeholder="ইমেইল">
      <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড">
      <button onclick="doLogin()">Login</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">

    <div class="section-card">
      <h3>সব অর্ডার</h3>
      <div class="order-tabs" id="orderTabs">
        <div class="order-tab active" data-filter="all" onclick="filterOrders('all', this)">সব</div>
        <div class="order-tab" data-filter="Pending" onclick="filterOrders('Pending', this)">Pending</div>
        <div class="order-tab" data-filter="Accepted" onclick="filterOrders('Accepted', this)">Accepted</div>
        <div class="order-tab" data-filter="Delivered" onclick="filterOrders('Delivered', this)">Delivered</div>
        <div class="order-tab" data-filter="Cancelled" onclick="filterOrders('Cancelled', this)">Cancelled</div>
      </div>
      <div class="history-toggle" id="historyToggle" onclick="toggleHistory()">🕓 পুরনো সম্পন্ন অর্ডার দেখুন</div>
      <div id="ordersList"></div>
    </div>

    <div class="section-card">
      <h3>নতুন পণ্য যোগ করুন</h3>
      <input type="text" id="pName" placeholder="পণ্যের নাম">
      <div class="form-row">
        <input type="text" id="pPrice" placeholder="দাম (৳)">
        <input type="text" id="pOldPrice" placeholder="আগের দাম (ঐচ্ছিক)">
      </div>
      <input type="text" id="pImage" placeholder="ছবির লিংক (URL)">
      <select id="pCategory">
        <option value="group1">আম</option>
        <option value="group2">আচার</option>
        <option value="group3">ছবি ৩</option>
        <option value="group4">ছবি ৪</option>
      </select>
      <button class="add-btn" id="addBtn" onclick="addProduct()">পণ্য যোগ করুন</button>
      <div class="status-msg" id="addStatus"></div>
    </div>

    <div class="section-card">
      <h3>সব পণ্য</h3>
      <div id="productList"></div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAdN_pY2ONFkYch-8dRwpR5JG8enxfJbEQ",
      authDomain: "nasim-world.firebaseapp.com",
      projectId: "nasim-world",
      storageBucket: "nasim-world.firebasestorage.app",
      messagingSenderId: "270942884516",
      appId: "1:270942884516:web:b7c3876d30a6bf1fc10c31"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const categoryLabels = { group1: "আম", group2: "আচার", group3: "ছবি ৩", group4: "ছবি ৪" };

    function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      if (!email || !password) {
        errEl.textContent = 'ইমেইল ও পাসওয়ার্ড দিন';
        return;
      }
      auth.signInWithEmailAndPassword(email, password)
        .catch(err => { errEl.textContent = 'লগইন ব্যর্থ — ইমেইল বা পাসওয়ার্ড ভুল'; });
    }

    function doLogout() {
      auth.signOut();
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('loginWrap').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        listenProducts();
        listenOrders();
      } else {
        document.getElementById('loginWrap').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'none';
      }
    });

    let editingId = null;

    function addProduct() {
      const name = document.getElementById('pName').value.trim();
      const price = document.getElementById('pPrice').value.trim();
      const oldPrice = document.getElementById('pOldPrice').value.trim();
      const src = document.getElementById('pImage').value.trim();
      const category = document.getElementById('pCategory').value;
      const statusEl = document.getElementById('addStatus');

      if (!name || !price || !src) {
        statusEl.textContent = 'নাম, দাম ও ছবির লিংক দিন';
        statusEl.style.color = '#ef4444';
        return;
      }

      const data = { name, price, oldPrice, src, category };

      if (editingId) {
        statusEl.textContent = 'আপডেট করা হচ্ছে...';
        statusEl.style.color = '#0284c7';
        db.collection('products').doc(editingId).update(data)
          .then(() => {
            statusEl.textContent = '✅ পণ্য আপডেট হয়েছে';
            statusEl.style.color = '#128C4A';
            cancelEdit();
          })
          .catch(() => {
            statusEl.textContent = 'সমস্যা হয়েছে, আবার চেষ্টা করুন';
            statusEl.style.color = '#ef4444';
          });
        return;
      }

      statusEl.textContent = 'যোগ করা হচ্ছে...';
      statusEl.style.color = '#0284c7';

      db.collection('products').add({ ...data, createdAt: Date.now() })
        .then(() => {
          statusEl.textContent = '✅ পণ্য যোগ হয়েছে';
          statusEl.style.color = '#128C4A';
          document.getElementById('pName').value = '';
          document.getElementById('pPrice').value = '';
          document.getElementById('pOldPrice').value = '';
          document.getElementById('pImage').value = '';
        })
        .catch(() => {
          statusEl.textContent = 'সমস্যা হয়েছে, আবার চেষ্টা করুন';
          statusEl.style.color = '#ef4444';
        });
    }

    function editProduct(id, name, price, oldPrice, src, category) {
      editingId = id;
      document.getElementById('pName').value = name;
      document.getElementById('pPrice').value = price;
      document.getElementById('pOldPrice').value = oldPrice || '';
      document.getElementById('pImage').value = src;
      document.getElementById('pCategory').value = category;
      document.getElementById('addBtn').textContent = 'আপডেট করুন';
      document.getElementById('addStatus').textContent = `"${name}" এডিট করছেন`;
      document.getElementById('addStatus').style.color = '#0284c7';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pOldPrice').value = '';
      document.getElementById('pImage').value = '';
      document.getElementById('addBtn').textContent = 'পণ্য যোগ করুন';
    }

    function deleteProduct(id) {
      if (!confirm('এই পণ্যটি মুছে ফেলতে চান?')) return;
      db.collection('products').doc(id).delete();
    }

    // ===== Orders =====
    let allOrders = [];
    let currentOrderFilter = 'all';
    let knownOrderIds = new Set();
    let ordersFirstLoad = true;

    function playNewOrderBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    function listenOrders() {
      db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snap => {
        allOrders = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        if (!ordersFirstLoad) {
          const newOnes = allOrders.filter(o => !knownOrderIds.has(o.id));
          if (newOnes.length > 0) playNewOrderBeep();
        }
        allOrders.forEach(o => knownOrderIds.add(o.id));
        ordersFirstLoad = false;

        // Auto-delete completed orders older than 2 weeks
        const TWO_WEEKS_MS = 14 * 24 * 60 * 60 * 1000;
        allOrders.forEach(o => {
          const isDone = (o.status === 'Delivered' || o.status === 'Cancelled');
          if (isDone && (Date.now() - o.createdAt) > TWO_WEEKS_MS) {
            db.collection('orders').doc(o.id).delete();
          }
        });

        const pendingCount = allOrders.filter(o => o.status === 'Pending').length;
        const alertBox = document.getElementById('orderAlert');
        document.getElementById('pendingOrderCount').textContent = pendingCount;
        if (pendingCount > 0) {
          alertBox.classList.add('show');
          document.title = `(${pendingCount}) NASIM WORLD — Admin`;
        } else {
          alertBox.classList.remove('show');
          document.title = 'NASIM WORLD — Admin';
        }

        renderOrders();
      });
    }

    function deleteOrder(id) {
      if (!confirm('এই অর্ডারটি মুছে ফেলতে চান?')) return;
      db.collection('orders').doc(id).delete();
    }

    function filterOrders(status, el) {
      currentOrderFilter = status;
      document.querySelectorAll('.order-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderOrders();
    }

    let showHistory = false;
    function toggleHistory() {
      showHistory = !showHistory;
      const btn = document.getElementById('historyToggle');
      btn.classList.toggle('active', showHistory);
      btn.textContent = showHistory ? '🕓 শুধু সাম্প্রতিক অর্ডার দেখুন' : '🕓 পুরনো সম্পন্ন অর্ডার দেখুন';
      renderOrders();
    }

    function renderOrders() {
      const listEl = document.getElementById('ordersList');
      let filtered = currentOrderFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentOrderFilter);

      const TWO_DAYS_MS = 2 * 24 * 60 * 60 * 1000;
      if (!showHistory) {
        filtered = filtered.filter(o => {
          const isDone = (o.status === 'Delivered' || o.status === 'Cancelled');
          const isOld = (Date.now() - o.createdAt) > TWO_DAYS_MS;
          return !(isDone && isOld);
        });
      }

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-msg">কোনো অর্ডার নেই</div>`;
        return;
      }

      listEl.innerHTML = '';
      filtered.forEach(order => {
        const card = document.createElement('div');
        card.className = 'order-card';
        const date = new Date(order.createdAt).toLocaleString('bn-BD', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

        let itemsHTML = '';
        (order.items || []).forEach(it => {
          itemsHTML += `<div>${it.name} x${it.qty} = ৳${it.price * it.qty}</div>`;
        });

        let actionsHTML = '';
        if (order.status === 'Pending') {
          actionsHTML = `
            <button class="btn-accept" onclick="updateOrderStatus('${order.id}','Accepted')">Accept</button>
            <button class="btn-cancel" onclick="updateOrderStatus('${order.id}','Cancelled')">Cancel</button>`;
        } else if (order.status === 'Accepted') {
          actionsHTML = `<button class="btn-deliver" onclick="updateOrderStatus('${order.id}','Delivered')">Delivered</button>`;
        }
        actionsHTML += `<a class="btn-call" href="tel:${order.phone}">📞 কল</a>`;
        actionsHTML += `<button class="order-del-btn" onclick="deleteOrder('${order.id}')">🗑️</button>`;

        card.innerHTML = `
          <div class="top-row">
            <span class="cust-name">${order.name}</span>
            <span class="order-badge ${order.status}">${order.status}</span>
          </div>
          <div class="meta">📞 ${order.phone} &nbsp;•&nbsp; ${date} &nbsp;•&nbsp; ${order.source || ''}</div>
          <div class="meta">📍 ${order.address}</div>
          <div class="items-list">${itemsHTML}</div>
          <div class="total-row">মোট: ৳${order.total}</div>
          <div class="order-actions">${actionsHTML}</div>`;
        listEl.appendChild(card);
      });
    }

    function updateOrderStatus(id, status) {
      db.collection('orders').doc(id).update({ status });
    }

    function listenProducts() {
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snap => {
        const grouped = { group1: [], group2: [], group3: [], group4: [] };
        snap.forEach(doc => {
          const data = doc.data();
          if (grouped[data.category]) grouped[data.category].push({ id: doc.id, ...data });
        });

        const listEl = document.getElementById('productList');
        listEl.innerHTML = '';

        Object.keys(categoryLabels).forEach(key => {
          const group = document.createElement('div');
          group.className = 'category-group';
          const items = grouped[key];
          let rowsHTML = '';
          if (items.length === 0) {
            rowsHTML = `<div class="empty-msg">কোনো পণ্য নেই</div>`;
          } else {
            items.forEach(item => {
              rowsHTML += `
                <div class="product-row">
                  <img src="${item.src}" onerror="this.style.background='#eaf6fc'">
                  <div class="info">
                    <div class="name">${item.name}</div>
                    <div class="price">৳${item.price}${item.oldPrice ? ' (আগে ৳' + item.oldPrice + ')' : ''}</div>
                  </div>
                  <button class="edit-btn" onclick='editProduct("${item.id}", ${JSON.stringify(item.name)}, ${JSON.stringify(item.price)}, ${JSON.stringify(item.oldPrice || "")}, ${JSON.stringify(item.src)}, "${item.category}")'>এডিট</button>
                  <button class="del-btn" onclick="deleteProduct('${item.id}')">মুছুন</button>
                </div>`;
            });
          }
          group.innerHTML = `<h4>${categoryLabels[key]}</h4>${rowsHTML}`;
          listEl.appendChild(group);
        });
      });
    }
  </script>

</body>
 </html>
