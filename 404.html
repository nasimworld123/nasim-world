<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পেজ পাওয়া যায়নি — NASIM WORLD</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23145C56'/%3E%3Ctext x='32' y='44' font-family='Arial, sans-serif' font-size='34' font-weight='bold' fill='%23F0B90B' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    position: relative; background: #FFFFFF;
    color: #1e2a38; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.8) 55%, rgba(255,255,255,0.85) 100%),
      url('leaf-bg.jpg') center / cover no-repeat;
    background-attachment: fixed; filter: blur(4px) saturate(1.15); transform: scale(1.08);
  }
  .wrap {
    max-width: 420px; background: rgba(255,255,255,0.55); backdrop-filter: blur(18px) saturate(1.1);
    -webkit-backdrop-filter: blur(18px) saturate(1.1); border: 1px solid rgba(255,255,255,0.6);
    border-radius: 24px; padding: 36px 26px; box-shadow: 0 10px 30px rgba(15,76,76,0.15);
  }
  .code { font-size: 4.5rem; font-weight: 900; color: #0F4C4C; line-height: 1; margin-bottom: 8px; }
  h1 { font-size: 1.15rem; color: #0F4C4C; margin-bottom: 10px; }
  p { font-size: 0.9rem; color: rgba(30,42,56,0.6); margin-bottom: 26px; line-height: 1.5; }
  a.btn {
    display: inline-block; text-decoration: none; background: linear-gradient(90deg,#17665F,#0F4C4C);
    color: #fff; font-weight: bold; padding: 13px 26px; border-radius: 14px; font-size: 0.9rem;
    box-shadow: 0 8px 20px rgba(15,76,76,0.3);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>দুঃখিত, এই পেজটি খুঁজে পাওয়া যায়নি</h1>
    <p>আপনি যে পেজটি খুঁজছেন সেটি সরানো হয়েছে অথবা এটির লিংক সঠিক নয়়। হোমপেজে ফিরে গিয়ে আপনার পছন্দের পণ্য খুঁজে নিন।</p>
    <a class="btn" href="/">হোমপেজে ফিরে যান</a>
  </div>
</body>
</html>
